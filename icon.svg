<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Zemin: Kapalı Devre Terminal Siyahı -->
  <rect width="512" height="512" fill="#050505" rx="112"/>
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- B Harfi (Bora) - Kurumsal Platin Sütun ve Keskin İvme Hatları -->
  <g stroke="#F3F4F6" stroke-width="36" fill="none" stroke-linejoin="miter">
    <!-- Dikey Sütun (Spine) -->
    <line x1="106" y1="122" x2="106" y2="390" />
    <!-- B Üst Döngü -->
    <path d="M 106 140 H 186 L 216 170 V 226 L 186 256 H 106" />
    <!-- B Alt Döngü (Görsel Denge İçin Biraz Daha Geniş) -->
    <path d="M 106 256 H 196 L 226 286 V 342 L 196 372 H 106" />
  </g>

  <!-- E Harfi (Ecevit) - Terminal Altını Veri Akış Düğümleri -->
  <g stroke="#D4AF37" stroke-width="36" fill="none">
    <!-- Dikey Sütun (Spine) -->
    <line x1="286" y1="122" x2="286" y2="390" />
    <!-- Veri Hatları (Sütundan 10px kopuk 'Devre Kartı' efekti) -->
    <line x1="314" y1="140" x2="406" y2="140" />
    <line x1="314" y1="256" x2="366" y2="256" />
    <line x1="314" y1="372" x2="406" y2="372" />
  </g>

  <!-- Aktif Terminal İmleci -->
  <rect x="314" y="420" width="92" height="12" fill="#D4AF37" filter="url(#glow)"/>
</svg>
